<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="balmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdf8" />
      <stop offset="50%" stop-color="#f5ede3" />
      <stop offset="100%" stop-color="#e3d6c5" />
    </linearGradient>

    <linearGradient id="terracottaJar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9816b" />
      <stop offset="50%" stop-color="#ab644e" />

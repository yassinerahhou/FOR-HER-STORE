<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Soft Studio Backdrop Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbf7" />
      <stop offset="50%" stop-color="#f5f0e8" />
      <stop offset="100%" stop-color="#ebe3d8" />
    </linearGradient>

    <!-- Rose Glass Fluid Gradient -->
    <linearGradient id="roseLiquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7d6d0" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#e8aeb0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c98488" stop-opacity="0.95" />
    </linearGradient>

    <!-- Gold Accent Metallic Gradient -->
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b87760" />
      <stop offset="25%" stop-color="#d49b87" />
      <stop offset="50%" stop-color="#eac6b8" />
      <stop offset="75%" stop-color="#d49b87" />
      <stop offset="100%" stop-color="#965843" />
    </linearGradient>

    <!-- Glass Reflection Highlight -->
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#252525" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Shadow under Bottle Base -->
  <ellipse cx="250" cy="425" rx="85" ry="16" fill="#252525" opacity="0.12" filter="blur(8px)" />

  <!-- Main Spray Bottle Group -->
  <g filter="url(#softShadow)">
    <!-- Spray Nozzle Base -->
    <rect x="235" y="110" width="30" height="25" fill="url(#goldCap)" rx="2" />
    <rect x="242" y="90" width="16" height="20" fill="#252525" rx="2" />
    <!-- Spray Actuator Top -->
    <rect x="238" y="75" width="24" height="18" fill="url(#goldCap)" rx="3" />

    <!-- Gold Neck Collar Ring -->
    <rect x="215" y="135" width="70" height="20" fill="url(#goldCap)" rx="3" />

    <!-- Glass Bottle Body (Frosted Pink Fluid Container) -->
    <rect x="180" y="155" width="140" height="250" rx="14" fill="url(#roseLiquid)" />

    <!-- Glass Outer Wall Highlight -->
    <rect x="180" y="155" width="140" height="250" rx="14" fill="url(#glassShine)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Elegant Label Box -->
    <rect x="198" y="210" width="104" height="145" fill="#fffdf9" rx="2" stroke="#252525" stroke-width="0.75" stroke-opacity="0.2" />

    <!-- Label Typography -->
    <text x="250" y="240" font-family="'Marcellus', 'Georgia', serif" font-size="15" font-weight="bold" fill="#252525" text-anchor="middle" letter-spacing="1">GAOUĀHER</text>
    <line x1="220" y1="250" x2="280" y2="250" stroke="#b87760" stroke-width="1" />
    <text x="250" y="270" font-family="'Space Mono', monospace" font-size="7.5" fill="#b87760" text-anchor="middle" letter-spacing="1.5">DAMASK ROSE</text>
    <text x="250" y="284" font-family="'Space Mono', monospace" font-size="7.5" fill="#252525" text-anchor="middle" letter-spacing="1">CLOUD ESSENCE</text>

    <text x="250" y="318" font-family="'Space Mono', monospace" font-size="6.5" fill="#252525" opacity="0.6" text-anchor="middle">150 ML / 5.1 FL OZ</text>
    <text x="250" y="334" font-family="'Space Mono', monospace" font-size="6" fill="#b87760" text-anchor="middle">100% ORGANIC BIO</text>
  </g>

  <!-- Ambient Floating Petal Accents -->
  <path d="M 120,380 C 110,350 140,330 160,350 C 180,370 140,400 120,380 Z" fill="#e8aeb0" opacity="0.6" />
  <path d="M 370,390 C 350,370 380,340 400,360 C 420,380 390,410 370,390 Z" fill="#c98488" opacity="0.5" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="lipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbf8" />
      <stop offset="50%" stop-color="#f7eee9" />
      <stop offset="100%" stop-color="#ebdcd6" />
    </linearGradient>

    <linearGradient id="roseLipFluid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9d5d2" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ea9d97" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#cf6962" />
    </linearGradient>

    <linearGradient id="roseGoldLipCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b87760" />
      <stop offset="50%" stop-color="#ebd1c8" />
      <stop offset="100%" stop-color="#8c4e3b" />
    </linearGradient>

    <linearGradient id="lipGlassReflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.5" />
    </linearGradient>

    <filter id="lipShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="16" flood-color="#252525" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#lipBg)" />

  <!-- Shadow Base -->
  <ellipse cx="250" cy="425" rx="55" ry="14" fill="#252525" opacity="0.14" filter="blur(7px)" />

  <!-- Lip Serum Wand Bottle Group -->
  <g filter="url(#lipShadow)">
    <!-- Rose Gold Cap Wand Top -->
    <rect x="205" y="100" width="90" height="135" rx="8" fill="url(#roseGoldLipCap)" />

    <!-- Crystal Clear Glass Fluid Vial Body -->
    <rect x="210" y="235" width="80" height="175" rx="10" fill="url(#roseLipFluid)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Glass Surface Reflection -->
    <rect x="210" y="235" width="80" height="175" rx="10" fill="url(#lipGlassReflection)" />

    <!-- Minimal Wordmark Print on Vial -->
    <text x="250" y="310" font-family="'Marcellus', 'Georgia', serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">GAOUĀHER</text>
    <text x="250" y="325" font-family="'Space Mono', monospace" font-size="6.5" fill="#ffffff" text-anchor="middle" letter-spacing="1">ROSE LIP OIL</text>
    <text x="250" y="360" font-family="'Space Mono', monospace" font-size="5.5" fill="#ffffff" opacity="0.8" text-anchor="middle">10 ML / 0.34 FL OZ</text>
  </g>
</svg>

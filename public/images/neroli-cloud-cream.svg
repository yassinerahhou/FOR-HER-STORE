<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Studio Background Gradient -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdf9" />
      <stop offset="60%" stop-color="#f2ebe1" />
      <stop offset="100%" stop-color="#e3d7c7" />
    </linearGradient>

    <!-- Frosted Amber Glass Gradient -->
    <linearGradient id="amberJar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce7d2" />
      <stop offset="50%" stop-color="#e8bd9b" />
      <stop offset="100%" stop-color="#c98c61" />
    </linearGradient>

    <!-- Dark Matte Wood Cap Gradient -->
    <linearGradient id="woodCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c1c1c" />
      <stop offset="50%" stop-color="#383838" />
      <stop offset="100%" stop-color="#1c1c1c" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#252525" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad2)" />

  <!-- Shadow Base -->
  <ellipse cx="250" cy="410" rx="120" ry="20" fill="#252525" opacity="0.14" filter="blur(9px)" />

  <!-- Main Cream Jar Group -->
  <g filter="url(#softShadow2)">
    <!-- Wooden Jar Lid Cap -->
    <rect x="155" y="160" width="190" height="55" rx="8" fill="url(#woodCap)" />
    <!-- Lid Ridge Detail -->
    <line x1="160" y1="210" x2="340" y2="210" stroke="#b87760" stroke-width="1.5" />

    <!-- Frosted Glass Jar Body -->
    <rect x="145" y="215" width="210" height="175" rx="16" fill="url(#amberJar)" />

    <!-- Label Box -->
    <rect x="175" y="250" width="150" height="110" fill="#fffdf9" rx="3" stroke="#252525" stroke-width="0.75" stroke-opacity="0.25" />

    <!-- Label Text -->
    <text x="250" y="278" font-family="'Marcellus', 'Georgia', serif" font-size="16" font-weight="bold" fill="#252525" text-anchor="middle" letter-spacing="1">GAOUĀHER</text>
    <line x1="210" y1="288" x2="290" y2="288" stroke="#b87760" stroke-width="1" />
    <text x="250" y="306" font-family="'Space Mono', monospace" font-size="8" fill="#b87760" text-anchor="middle" letter-spacing="1.5">ORANGE BLOSSOM</text>
    <text x="250" y="320" font-family="'Space Mono', monospace" font-size="8" fill="#252525" text-anchor="middle" letter-spacing="1">CLOUD CREAM</text>

    <text x="250" y="346" font-family="'Space Mono', monospace" font-size="7" fill="#252525" opacity="0.6" text-anchor="middle">50 ML / 1.7 FL OZ</text>
  </g>

  <!-- Neroli Flower Accent -->
  <g transform="translate(100, 340)">
    <circle cx="20" cy="20" r="7" fill="#b87760" />
    <ellipse cx="20" cy="5" rx="6" ry="12" fill="#fffdf9" />
    <ellipse cx="20" cy="35" rx="6" ry="12" fill="#fffdf9" />
    <ellipse cx="5" cy="20" rx="12" ry="6" fill="#fffdf9" />
    <ellipse cx="35" cy="20" rx="12" ry="6" fill="#fffdf9" />
  </g>
</svg>

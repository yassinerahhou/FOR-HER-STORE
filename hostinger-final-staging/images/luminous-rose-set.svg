<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="boxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbf7" />
      <stop offset="50%" stop-color="#f5eee6" />
      <stop offset="100%" stop-color="#e8ded1" />
    </linearGradient>

    <linearGradient id="goldBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f3" />
      <stop offset="50%" stop-color="#f3e2d6" />
      <stop offset="100%" stop-color="#e2c8b8" />
    </linearGradient>

    <linearGradient id="roseLiquidSet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c2bc" />
      <stop offset="100%" stop-color="#d98982" />
    </linearGradient>

    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b87760" />
      <stop offset="50%" stop-color="#eac6b8" />
      <stop offset="100%" stop-color="#965843" />
    </linearGradient>

    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#252525" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#boxBg)" />

  <!-- Shadow Base -->
  <ellipse cx="250" cy="430" rx="140" ry="22" fill="#252525" opacity="0.14" filter="blur(9px)" />

  <!-- Main Luxury Presentation Box -->
  <g filter="url(#boxShadow)">
    <!-- Box Lid Base -->
    <rect x="110" y="150" width="280" height="240" rx="12" fill="url(#goldBoxGrad)" stroke="#b87760" stroke-width="1.5" />

    <!-- Gold Embossed Foil Border -->
    <rect x="125" y="165" width="250" height="210" rx="8" fill="none" stroke="url(#goldRibbon)" stroke-width="1" stroke-dasharray="8 4" />

    <!-- Center Product Trio Presentation -->
    <!-- 1. Rose Essence Bottle Left -->
    <rect x="150" y="210" width="45" height="110" rx="6" fill="url(#roseLiquidSet)" />
    <rect x="162" y="195" width="21" height="15" fill="url(#goldRibbon)" rx="2" />
    <rect x="165" y="235" width="15" height="60" fill="#fffdf9" opacity="0.9" />

    <!-- 2. Rose Scrub Jar Center -->
    <rect x="210" y="240" width="80" height="80" rx="8" fill="url(#roseLiquidSet)" />
    <rect x="205" y="225" width="90" height="20" fill="#252525" rx="3" />
    <rect x="220" y="260" width="60" height="45" fill="#fffdf9" opacity="0.9" />

    <!-- 3. Rose Lip Oil Right -->
    <rect x="305" y="220" width="35" height="100" rx="6" fill="url(#roseLiquidSet)" />
    <rect x="312" y="200" width="21" height="20" fill="url(#goldRibbon)" rx="2" />

    <!-- Box Typography Label -->
    <text x="250" y="348" font-family="'Marcellus', 'Georgia', serif" font-size="15" font-weight="bold" fill="#252525" text-anchor="middle" letter-spacing="2">GAOUĀHER</text>
    <text x="250" y="362" font-family="'Space Mono', monospace" font-size="7.5" fill="#b87760" text-anchor="middle" letter-spacing="1.5">LUMINOUS ROSE DISCOVERY RITUAL</text>
  </g>
</svg>

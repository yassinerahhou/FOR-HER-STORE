<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="dropBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fbfd" />
      <stop offset="50%" stop-color="#ebf3f7" />
      <stop offset="100%" stop-color="#d6e4ed" />
    </linearGradient>

    <linearGradient id="cobaltGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d529b" />
      <stop offset="50%" stop-color="#1b366e" />
      <stop offset="100%" stop-color="#0f2046" />
    </linearGradient>

    <linearGradient id="pipetteCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#252525" />
      <stop offset="50%" stop-color="#404040" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#252525" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#dropBg)" />

  <ellipse cx="250" cy="425" rx="85" ry="16" fill="#252525" opacity="0.14" filter="blur(8px)" />

  <g filter="url(#dropShadow)">
    <!-- Dropper Bulb Top -->
    <path d="M 235,70 Q 250,50 265,70 L 265,100 L 235,100 Z" fill="#ffffff" stroke="#252525" stroke-width="1" />
    <rect x="220" y="100" width="60" height="40" fill="url(#pipetteCap)" rx="4" />

    <!-- Cobalt Blue Bottle Body -->
    <rect x="180" y="140" width="140" height="260" rx="14" fill="url(#cobaltGlass)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" />

    <!-- Label -->
    <rect x="198" y="195" width="104" height="150" fill="#fffdf9" rx="2" stroke="#252525" stroke-width="0.75" stroke-opacity="0.2" />

    <text x="250" y="225" font-family="'Marcellus', 'Georgia', serif" font-size="14" font-weight="bold" fill="#252525" text-anchor="middle" letter-spacing="1">GAOUĀHER</text>
    <line x1="220" y1="235" x2="280" y2="235" stroke="#b87760" stroke-width="1" />
    <text x="250" y="254" font-family="'Space Mono', monospace" font-size="7.5" fill="#252525" text-anchor="middle" letter-spacing="1.2">MAJORELLE BLUE</text>
    <text x="250" y="268" font-family="'Space Mono', monospace" font-size="7.5" fill="#b87760" text-anchor="middle" letter-spacing="1">GLOW DROPS</text>

    <text x="250" y="305" font-family="'Space Mono', monospace" font-size="6.5" fill="#252525" opacity="0.6" text-anchor="middle">30 ML / 1.0 FL OZ</text>
    <text x="250" y="322" font-family="'Space Mono', monospace" font-size="6" fill="#b87760" text-anchor="middle">SAHARA INDIGO BIO</text>
  </g>
</svg>
